# Node 0.8.2；UTF-8 YAML，缩进使用空格。
# 所有相对本地路径以本文件目录为基准；不展开 ~、$HOME 或 shell 表达式。
config_version: 2  # 配置格式版本，当前仅支持 2；省略时也是 2。
hub_url: http://192.168.50.10:8787  # 首次必须：从 Hub 部署者取得的基址；已有身份可省略。
name: office-node  # 可选：首次生成身份时的名称，默认机器名；不修改已有身份名称。
identity_file: .runbridge/node.json  # 默认此路径；首次自动生成，重启复用，不手工填写秘密。
enrollment_token_file: .runbridge/enrollment.token  # 首次登记必需的 Hub 原始单行文本路径。
# 已登记后可删除上面 enrollment_token_file 字段；也可一直保留以幂等确认登记。
# 无文件时可从 RUNBRIDGE_ENROLLMENT_TOKEN 读取；两者都有时文件优先。
tools:  # 默认 {}，此时只接入控制连接，不提供浏览器资源。
  playwright:  # 当前唯一已实现的工具适配器。
    resource_id: chromium  # 默认 chromium；签发许可时使用完全相同的值。
    mode: managed  # 默认 managed：每次会话新建 Chromium；另一个值为 borrowed。
    # browser_cache_directory 默认不设置，遵循 PLAYWRIGHT_BROWSERS_PATH 或 Playwright 默认缓存。
    # browser_cache_directory: /absolute/path/to/shared-browsers
    launch_options:  # 默认 {}；只用于 managed，参数采用 Python Playwright 的 snake_case。
      headless: true  # Playwright 默认 true；设 false 需要可用的图形桌面会话。
      timeout: 20000  # 本项目启动默认 20000 毫秒；范围 1～30000，不接受无限超时。
      # channel: chrome  # 默认省略：使用匹配的 Chromium；可由所有者选择已准备的兼容浏览器。
      # executable_path: /absolute/path/to/chromium  # 默认省略；自选可执行文件的兼容性由所有者确认。
      # args: []  # 默认省略：采用 Playwright 默认参数；可追加自定义参数。
      # 项目始终在最后追加 --password-store=basic、--use-mock-keychain，专用浏览器不使用系统凭据库。
      # ignore_default_args: []  # 默认不忽略；过滤 SDK 默认参数也不会移除上面的项目存储参数。
      # chromium_sandbox: false  # Playwright 默认 false；启用需系统支持。
      # env: {LANG: "zh_CN.UTF-8"}  # 默认继承进程环境；自定义时确认必要系统/显示环境。
      # downloads_path: downloads  # 默认 Playwright 临时目录；指定路径相对本 YAML。
      # traces_dir: traces  # 默认不指定用户目录；指定路径相对本 YAML，不自动开启远程 trace 功能。
      # artifacts_dir: artifacts  # 默认 Playwright 临时目录；指定路径相对本 YAML。
      # slow_mo: 0  # 默认 0 毫秒；每步增加延迟，用于观察，不代替动作超时。
      # proxy: {server: "http://proxy.example:8080"}  # 默认无代理；只影响浏览器访问网站。
# 已有 Chrome 改为以下结构，并删除 managed 的 launch_options/browser_cache_directory：
# tools:
#   playwright:
#     resource_id: chrome  # 自定义名称，仍须与许可范围一致；省略仍为 chromium。
#     mode: borrowed  # 复用已授权浏览器；释放会话只断开项目连接。
#     authorization_scope: BROWSER_INSTANCE  # borrowed 必须显式填写，授权该实例的所有页面。
#     cdp_endpoint: ws://127.0.0.1:9222/devtools/browser/实际浏览器ID  # 必须是本机固定实例 WebSocket。
