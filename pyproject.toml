[project]
name = "runbridge-node"
version = "0.4.0"
description = "RunBridge 本机节点客户端"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx>=0.28,<1", "packaging>=25", "pydantic>=2.12,<3", "websockets>=15,<18"]

[project.optional-dependencies]
visual = ["browscreen>=0.3.1,<0.4.0"]

[project.scripts]
runbridge-node = "runbridge_node.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["playwright==1.63.0", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.sdist]
exclude = ["/doc/reference/构建产物核验记录.json", "/doc/reference/文档核验记录.json", "/doc/reference/R4构建产物核验记录.json", "/doc/reference/R4文档核验记录.json", "/doc/reference/画面流构建产物核验记录.json", "/doc/reference/画面流文档核验记录.json"]
