[project]
name = "runbridge-node"
version = "0.6.0"
description = "RunBridge 本机节点客户端"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx>=0.28,<1", "packaging>=25", "psutil>=7,<9", "pydantic>=2.12,<3", "PyYAML>=6.0,<7", "websockets>=15,<18"]

[project.optional-dependencies]
playwright = ["playwright==1.63.0"]
visual = ["browscreen>=0.3.1,<0.4.0"]

[project.scripts]
runbridge-node = "runbridge_node.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["playwright==1.63.0", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: 需要显式启用的真实 Python worker 和 Chromium 测试"]

[[tool.uv.index]]
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.sdist]
exclude = ["/doc/reference/DSH扩展修复核验记录.json", "/doc/reference/构建产物核验记录.json", "/doc/reference/文档核验记录.json", "/doc/reference/R4构建产物核验记录.json", "/doc/reference/R4文档核验记录.json", "/doc/reference/画面流构建产物核验记录.json", "/doc/reference/画面流文档核验记录.json"]
