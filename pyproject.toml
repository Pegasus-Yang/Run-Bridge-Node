[project]
name = "runbridge-node"
version = "0.8.2"
description = "Remote browser worker for RunBridge Hub with managed Chromium and existing Chrome reuse"
readme = { file = "README.en.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pegasus-Yang", email = "panesas2@gmail.com" }]
keywords = ["runbridge", "browser-automation", "playwright", "chromium", "remote-browser"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.14,<3.15"
dependencies = ["httpx>=0.28,<1", "packaging>=25", "psutil>=7,<9", "pydantic>=2.12,<3", "PyYAML>=6.0,<7", "websockets>=15,<18"]

[project.urls]
Homepage = "https://github.com/Pegasus-Yang/Run-Bridge-Node"
Documentation = "https://github.com/Pegasus-Yang/Run-Bridge-Node/blob/main/doc/README.en.md"
"Chinese Documentation" = "https://github.com/Pegasus-Yang/Run-Bridge-Node/blob/main/doc/README.md"
Repository = "https://github.com/Pegasus-Yang/Run-Bridge-Node"
Issues = "https://github.com/Pegasus-Yang/Run-Bridge-Node/issues"
Changelog = "https://github.com/Pegasus-Yang/Run-Bridge-Node/blob/main/doc/project/版本发布记录.md"

[project.optional-dependencies]
playwright = ["playwright==1.63.0"]
visual = ["browscreen>=0.3.1,<0.4.0"]

[project.scripts]
runbridge-node = "runbridge_node.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["playwright==1.63.0", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: 需要显式启用的真实 Python worker 和 Chromium 测试"]

[[tool.uv.index]]
name = "aliyun"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/runbridge_node"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/README.md", "/README.en.md", "/LICENSE",
    "/CONTRIBUTING.md", "/CONTRIBUTING.en.md", "/AGENTS.md", "/.gitignore",
    "/pyproject.toml", "/uv.lock", "/doc/README.md", "/doc/README.en.md",
    "/doc/user-guide", "/doc/deployment", "/doc/reference",
    "/doc/architecture", "/doc/development",
    "/doc/project/版本发布记录.md", "/doc/project/GitHub展示配置.md",
]
exclude = [
    "/doc/reference/*.json", "/doc/reference/*.png",
    "/doc/development/protocol", "/doc/development/examples",
]
